version: 1

build:
  language: java
  jdkVersion: 11
  mavenVersion: 3.8.6

  # Maven build configuration
  maven:
    goals: clean install
    profiles: []
    properties: {}

  # Quality gates
  quality:
    codeQuality:
      enabled: true
      threshold: 70
    security:
      enabled: true
      threshold: 70
    performance:
      enabled: true
      threshold: 70

# Environment-specific configurations
environments:
  dev:
    type: dev
    deploymentStrategy: rolling

  stage:
    type: stage
    deploymentStrategy: rolling
    approvalRequired: false

  prod:
    type: prod
    deploymentStrategy: blue-green
    approvalRequired: true
